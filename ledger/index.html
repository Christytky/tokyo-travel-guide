<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#215548"><title>東京旅帳 · Usagi & Momonga</title><link rel="stylesheet" href="style.css"><link rel="icon" href="icon.svg"></head><body>
<header><div><span class="mark" aria-hidden="true">旅</span><span>東京旅帳</span></div><small>USAGI ＆ MOMONGA</small></header>
<main><a href="../" style="font-size:14px;color:#215548">‹ 旅行首頁</a><div class="status"><span id="network" role="status"></span><button id="login" type="button" hidden>Google 登入</button></div>
<nav aria-label="主選單"><button data-tab="entry" aria-current="page">記帳</button><button data-tab="ledger">明細</button><button data-tab="wallet">錢包</button><button data-tab="summary">結算</button></nav>
<section id="entry" hidden><h1>新增開支</h1><form id="expense">
<div class="row"><label>日期<input id="day" type="date" required></label><label>金額（日圓）<input id="amount" inputmode="numeric" type="number" min="1" max="999999999" step="1" placeholder="¥ 0" required></label></div>
<fieldset><legend>常用項目</legend><select id="item" hidden aria-label="常用項目"></select><div id="catTabs" class="chips cats" aria-label="項目分類"></div><div id="itemTabs" class="chips" aria-label="項目"></div></fieldset><button type="button" id="addItem" class="link">＋ 新增常用項目</button>
<div id="suicaBox" hidden><label>Suica 卡主<select id="owner"><option>Usagi</option><option>Momonga</option></select></label></div>
<fieldset><legend>付款來源</legend><div id="pays"></div><button type="button" id="addPay" class="link">＋ 拆分付款</button></fieldset>
<label>費用分攤<select id="split"><option value="half">二人平分</option><option>Usagi</option><option>Momonga</option><option value="exact">自訂金額</option></select></label>
<div id="exactBox" hidden><label>Usagi 份額（日圓）<input type="number" min="0" step="1" id="exact" inputmode="numeric"></label></div><p class="hint" id="shares"></p>
<label>備註（選填）<input id="note" maxlength="500" placeholder="例如：餐廳名稱、購買地點"></label>
<button class="primary">儲存開支</button><button type="button" id="copyDraft" class="secondary">複製文字到備忘錄</button></form></section>
<section id="ledger" hidden><h1>開支明細</h1><div class="backup"><h2>交換完整帳簿</h2><p>複製下方某日的全日記錄，用 WhatsApp 傳送整段訊息。收到後貼在這裡，重複匯入只計一次。</p><label>WhatsApp 帳目訊息<textarea id="pasteDay"></textarea></label><button type="button" class="primary" id="mergeDay">貼上後合併</button><button class="secondary" id="backupOut">匯出完整帳簿（JSON）</button><label class="secondary filePick">匯入並合併帳簿<input id="backupIn" type="file" accept=".json,application/json"></label><p role="status" id="mergeResult"></p></div><div id="history"></div></section>
<section id="wallet" hidden><h1>錢包</h1><h2>出發時的私人現金</h2><p class="hint">填寫放入公用錢包前，各人隨身帶備的日圓。每人保留最近填報的金額。</p><div id="openingList"></div><form id="openingForm"><div class="row"><label>成員<select id="openingPerson"><option>Usagi</option><option>Momonga</option></select></label><label>起始現金（日圓）<input id="openingAmount" required type="number" min="0" max="999999999" step="1" inputmode="numeric"></label></div><button class="primary">儲存起始現金</button></form><h2>公用錢包</h2><div id="walletTotals"></div><form id="transfer"><label>交易<select id="kind"><option value="deposit">放入現金</option><option value="return">取回現金</option></select></label><div class="row"><label>成員<select id="person"><option>Usagi</option><option>Momonga</option></select></label><label>日期<input type="date" id="walletDay" required></label></div><label>金額（日圓）<input type="number" id="walletAmount" inputmode="numeric" min="1" max="999999999" step="1" required></label><button class="primary">儲存錢包交易</button></form><h2>錢包收支</h2><div id="walletLog"></div></section>
<section id="summary" hidden><h1>旅程結算</h1><div id="results"></div><button id="export" class="secondary">下載 Excel 帳簿</button></section></main>
<dialog id="newItem"><form id="itemForm"><h2>新增常用項目</h2><label>名稱<input id="itemName" required maxlength="40"></label><label>分類<select id="category"></select></label><button class="primary">加入並選用</button><button class="secondary" type="button" data-close>取消</button></form></dialog>
<dialog id="clipboard"><h2>複製記錄</h2><textarea readonly id="manual"></textarea><button class="secondary" data-close>完成</button></dialog><div role="status" id="toast"></div>
<script src="config.js"></script><script src="book.js"></script><script src="excel.js"></script><script src="backup.js"></script><script src="app.js"></script></body></html>
